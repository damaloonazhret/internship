	      rel="stylesheet">

</head>
<body class="body">
	<header class="header">
		<a href="https://learn.javascript.ru/"
		   target="_blank">
			<img src="./assets/logo.avif" alt="asd">
		</a>
		
		<section class="table">
			<div id="thead">Header for table</div>
			<div id="firstRow">
				<div>
					<span class="bold">Bold text</span>
				</div>
				<div>
					<span class="strong">Important text</span>
				</div>
				<div>
					<span class="sup">Superscript text</span>
				</div>
				<div>
					<span class="sub">Subscript text</span>
				</div>
				<div>
					<span class="ins">Inserted text</span>
				</div>
			</div>
			<div id="secondRow">
				<div>
					<span class="del">Deleted text</span>
				</div>
				<div>
					<span class="small">Smaller text</span>
				</div>
				<div>
					<span class="mark">Marked text</span>
				</div>
				<div>
					<span class="i">Italic text</span>
				</div>
				<div>
					<span class="em">Emphasized text</span>
				</div>
			</div>
			<div id="tfoot">Footer for table</div>
		</section>
	
	</header>
	
	<main class="main">
		
		<article class="data content">
			<form class="data__form" action="./index.html">
				<fieldset>
					<label>
						<label for="firstName">First Name:</label>
						<input type="text" id="firstName" name="firstName">
						<label for="lastName">Last Name:</label>
						<input type="text" id="lastName" name="lastName">
						<label for="age">Age:</label>
						<input type="number" id="age" name="age">
					</label>
					<label>
						<input class="button-hover" type="submit">
						<input class="button-hover" type="reset">
					</label>
				</fieldset>
			</form>
		</article>
		
		<aside id="aside">
			<section class="items">
				<article class="data check">
					<form class="data__form" action="./index.html">
						
						<label for="dataList">Check:</label>
						<input id="dataList" list="language">
						
						<datalist id="language">
							<option value="TypeScript">
							<option value="C++">
							<option value="PHP">
							<option value="Swift">
							<option value="Go">
						</datalist>
						
						<input class="button-hover" type="submit">
					</form>
					<form action="./index.html">
						
						<label for="select">Choose:</label>
						
						<select name="select" id="select">
							<option value="JavaScript">JavaScript</option>
							<option value="Java">Java</option>
							<option value="Python">Python</option>
						</select>
						
						<input class="button-hover" type="submit">
					</form>
				</article>
				
				<article class="data">
					<form id="radio" class="data__form">
						<label class="radio">
							<input id="vue" type="radio" name="framework" value="Vue">
							<label for="vue">Vue</label>
						</label>
						<label class="radio">
							<input id="angular" type="radio" name="framework" value="Angular">
							<label for="angular">Angular</label>
						</label>
						<label class="radio">
							<input id="next" type="radio" name="framework" value="Next" checked>
							<label for="next">Next.js</label>
						</label>
						<div>
							<input style="border: none" type="checkbox">
							<input id="color" style="border: none" type="color">
						</div>
					</form>
				</article>
				
				<article class="data send">
					<form class="data__form" action="./index.html">
						<label data-footer-label for="textarea">Send your message:</label>
						<textarea class="textarea" name="message" rows="2" cols="20" id="textarea">

            </textarea>
						<input class="button-hover" type="submit">
					</form>
				</article>
			</section>
			
			<footer class="data footer">
				<form class="data__form data__form-table-cell"></form>
				<article>
					<label id="arithmetics">
						<input type="number" max="3">
						<select id="operators" name="operators">
							<option value="+">+</option>
							<option value="-">-</option>
							<option value="*">*</option>
							<option value="/">/</option>
						</select>
						<input type="number" max="3">
						<span id="equal">=</span>
						<span id="solution"></span>
					</label>
				</article>
				<article id="events">
					<span id="arithmeticOperation">Arithmetic operations</span>
					<span id="workingWithStrings">Working with strings</span>
					<span id="variableAssigment">Variable assignment</span>
					<span id="console">Console.log</span>
					<span id="logicalOperation">Logical operation</span>
					<span id="tryCatch">Try catch</span>
					<span id="cycles">Cycles</span>
					<span id="classes">Classes</span>
					<span id="generators">Generators</span>
				</article>
			</footer>
		</aside>
	
	</main>
	<script src="./scripts/arithmetic.js"></script>
	<script src="./scripts/strings.js"></script>
	<script src="./scripts/variable.js"></script>
	<script src="./scripts/console.js"></script>
	<script src="./scripts/logic.js"></script>
	<script src="./scripts/tryCatch.js"></script>
	<script src="./scripts/arithmeticEvent.js"></script>
	<script src="./scripts/cycles.js"></script>
	<script src="./scripts/functionConstructor.js"></script>
	<script src="./scripts/class.js"></script>
	<script src="./scripts/generators.js"></script>
	<script src="./index.js"></script>
</body>
</html>
